name: Build Prover Image
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone sequencer (shallow, full — CI has fast bandwidth to GitHub)
        run: |
          git clone --depth 1 https://github.com/starkware-libs/sequencer.git /tmp/sequencer
          cd /tmp/sequencer
          echo "Resolved commit: $(git rev-parse HEAD)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prover image
        uses: docker/build-push-action@v5
        with:
          context: /tmp/sequencer
          file: /tmp/sequencer/crates/starknet_transaction_prover/Dockerfile
          push: true
          tags: ghcr.io/phllp-tanstic/oxa-protocol/prover:latest
